name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- native
  native:
    name: solver (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native -j 4 --config Release

      - name: Self test (Linux)
        if: runner.os == 'Linux'
        run: LD_LIBRARY_PATH=build/native ./build/native/selftest

      - name: Self test (Windows)
        if: runner.os == 'Windows'
        run: ./build/native/Release/selftest.exe

      - name: Runner info (macOS)
        if: runner.os == 'macOS'
        run: uname -m; sw_vers; xcodebuild -version | head -1

      - name: Self test (macOS)
        if: runner.os == 'macOS'
        run: ./build/native/selftest

  # --------------------------------------------------------------- app
  app:
    name: app (${{ matrix.rid }})
    needs: native
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-latest
            rid: osx

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Resolve macOS runtime identifier
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            echo "RID=osx-arm64" >> "$GITHUB_ENV"
          else
            echo "RID=osx-x64" >> "$GITHUB_ENV"
          fi

      - name: Configure native library
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build native library
        run: cmake --build build/native -j 4 --config Release

      - name: Publish Avalonia app (NativeAOT)
        shell: bash
        run: dotnet publish src/LightsOut/LightsOut.csproj -c Release -r $RID -o dist/$RID --nologo

      - name: Bundle native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item build/native/Release/lightsout.dll dist/$env:RID/

      - name: Bundle native library (Linux)
        if: runner.os == 'Linux'
        run: cp build/native/liblightsout.so dist/$RID/

      - name: Bundle native library (macOS)
        if: runner.os == 'macOS'
        run: cp build/native/liblightsout.dylib dist/$RID/

      - name: Drop debug symbols
        shell: bash
        run: rm -rf dist/$RID/*.pdb dist/$RID/*.dbg dist/$RID/*.dSYM

      - name: Show package contents
        shell: bash
        run: ls -la dist/$RID

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lightsout-${{ env.RID }}
          path: dist/${{ env.RID }}
          if-no-files-found: error

  # ------------------------------------------------------------- release
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore executable bits
        run: |
          set -euo pipefail
          chmod +x artifacts/*/LightsOut 2>/dev/null || true

      - name: Pack release archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd artifacts
          for d in lightsout-*; do
            rid="${d#lightsout-}"
            (cd "$d" && zip -q -r "../lightsout-${version}-${rid}.zip" .)
          done
          ls -lh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
